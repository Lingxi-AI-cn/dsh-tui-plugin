name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
          registry-url: https://registry.npmjs.org/
      - run: npm install --global npm@11
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify
      - run: pnpm run verify:clean-room
      - run: pnpm run pack:release
      - run: node scripts/publish-release.mjs --publish --provenance --tag next
