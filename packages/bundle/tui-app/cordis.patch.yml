# The post-install native terminal surface over dsh-base. Model-visible rows
# move behind the official Agent preset roster; Host registries, persistence,
# providers, and terminal interaction remain process-wide. No HTTP/browser
# rows are mounted.

- id: system-prompt
  config:
    persona: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

- id: hmr
  disabled: true

- id: tools
  config:
    mode: !!js process.env.DSH_TOOLS_MODE

# Keep this ownership list aligned with the official Web preset surface. These
# rows are Agent-plane consumers in dsh-base; leaving even one enabled leaks a
# global tool or prompt behavior into Minimal and can collide with a preset's
# scoped registration.
- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true

- id: tool-jobs
  disabled: true

- id: tool-fs
  disabled: true

- id: tool-fs-search
  disabled: true

- id: tool-str-replace-editor
  disabled: true

- id: skill-filesystem
  disabled: true

- id: tool-skill
  disabled: true

- id: tool-goal
  disabled: true

- id: command-goal
  disabled: true

- id: plan-mode
  disabled: true

- id: compaction-basic
  disabled: true

- id: command-compact
  disabled: true

- id: tool-result-pruner
  disabled: true

- id: tool-subagent-control
  disabled: true

- id: tool-subagent-list-agents
  disabled: true

- id: tool-subagent
  disabled: true

- id: tool-subagent-fork
  disabled: true

- id: workflow-worker-thread
  disabled: true

- id: tool-workflow
  disabled: true

- id: tool-ralph
  disabled: true

- id: agent-instructions
  disabled: true

- id: tool-todo
  disabled: true

- id: tool-web
  disabled: true

- insert:
    # Delegation tools read the Host-owned opt-in sampled when a Session
    # mounts its preset.
    - id: subagent-model-selection-settings
      name: '@deepseek-ai/dsh-tool-subagent/model-selection-settings'

    # PTC owns only the per-Agent Code Mode presentation. Its worker runtime is
    # a Host singleton shared by every PTC Session.
    - id: code-runtime
      name: '@deepseek-ai/dsh-code-runtime-worker-thread'

    # Creator composes the model-facing Cordis tool inside the preset; its
    # runtime/inspection backends are Host singletons shared by all Sessions.
    - id: cordis-host-runner
      name: '@deepseek-ai/dsh-cordis-host-runner'

    # The terminal Session Manager uses the same durable Workspace owner as
    # the Web sidebar. Removing a Workspace registration never removes its
    # directory or Session logs.
    - id: workspace
      name: '@deepseek-ai/dsh-workspace'

    # Canonical cross-Session mentions and bounded host-local @file discovery
    # share the same owners as the Web composer. No referenced content is
    # copied into the terminal draft.
    - id: session-reference
      name: '@deepseek-ai/dsh-session-reference'

    - id: file-reference-local
      name: '@deepseek-ai/dsh-file-reference-local'

    # Durable whole-log turn timing backs the TUI footer's settled TTFT and
    # decode-throughput detail; the projection is inert until the Session log
    # contains provider timing boundaries.
    - id: session-stats
      name: '@deepseek-ai/dsh-session-stats'

    # The native status row and /schedules panel consume this owner's active
    # projection. Creation, deletion, persistence, and dispatch remain owned
    # by the Schedule package and its model-facing tools.
    - id: schedule
      name: '@deepseek-ai/dsh-schedule'

    # A terminal-rendered, bounded directory browser works both on local
    # desktops and on headless/SSH Hosts; an overlay may replace this row with
    # the native backend and the TUI will drive its single pick() capability.
    - id: directory-picker
      name: '@deepseek-ai/dsh-host-directory-picker-browse'
      config:
        maxEntries: 1000

    # Feedback is stored outside the Session transcript and keyed to finalized
    # assistant message identity by the same owner used by the Web surface.
    - id: message-feedback
      name: '@deepseek-ai/dsh-message-feedback'
      config:
        maxNoteBytes: 4096

    # /host-plugins projects the current Loader tree through this read-only
    # owner; it never walks Cordis internals from the TUI package.
    - id: host-plugin-inventory
      name: '@deepseek-ai/dsh-host-plugin-inventory'

    # Terminal and provider plugins share the official human authorization
    # conversation owner. Credentials remain in the base profile's store.
    - id: authorization
      name: '@deepseek-ai/dsh-authorization'

    # ChatGPT OAuth credentials and the account model catalog remain owned by
    # the independently installed adapter. The official base supplies only its
    # Host LLM and pi-ai service packages.
    - id: llm-openai-codex
      name: '@lingxi-ai-cn/dsh-llm-openai-codex'
      config:
        clientVersion: '0.146.0'

    # Native Session export writes the complete durable archive directly to a
    # user-selected host directory; no HTTP or browser transport is mounted.
    - id: session-log-export
      name: '@lingxi-ai-cn/dsh-session-export'

    # Plugin Hub installation is human-only. The signing key is a shipped
    # trust root; /v1/meta may report rotation state but cannot add a key to
    # this list.
    - id: plugin-hub
      name: '@lingxi-ai-cn/dsh-plugin-hub'

    - id: plugin-hub-local
      name: '@lingxi-ai-cn/dsh-plugin-hub-local'
      config:
        profile: tui
        # Official alpha.2 has no generic pre-composition recovery hook. Keep the
        # published post-install bundle catalog-only and use `dsh plugin` for
        # profile changes.
        profileMutations: false
        registryUrl: 'https://redshell-ai.com:9000'
        trustedKeys:
          - keyId: registry-2026-08
            publicKey: |-
              -----BEGIN PUBLIC KEY-----
              MCowBQYDK2VwAyEAqj35K1D/FbALPXPhN5zfemJZyoUt1V37MWV4J4YNMLc=
              -----END PUBLIC KEY-----

    - id: tui-startup
      name: '@lingxi-ai-cn/dsh-tui/startup'

    # The official package owns both its bundled system presets and the
    # writable DSH_HOME user root.
    - id: agent-presets
      name: '@deepseek-ai/dsh-agent-presets'
      config:
        default: standard
        includeShippedRoot: true
        includeUserRoot: true

    - id: tui-app
      name: '@lingxi-ai-cn/dsh-tui'

    - id: tui
      name: '@lingxi-ai-cn/dsh-tui-runtime'
      inject: [tuiStartup]
      config:
        resume: !!js ctx.tuiStartup.resume
